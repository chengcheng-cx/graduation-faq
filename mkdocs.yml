site_name: 研究所畢業資訊 FAQ
site_description: 研究所畢業相關資訊與常見問題整理

theme:
  name: material
  language: zh-TW

  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences

nav:
  - 首頁: index.md
  - 常用網址:
      - links/index.md
      - 碩士服訂購表單: https://docs.google.com/forms/d/e/1FAIpQLSfigaZEGt4SE57JOXiF9-oLusy4qgXGmEVtma_jCFoO7RRFgg/viewform
      - 碩士服明細: https://docs.google.com/spreadsheets/d/e/2PACX-1vQJ82GnJUMZ2iOqCFva5V1Zw8LnDuM06DSLrt2oyZlGNGwzTf43C4MQ5jDoG6gkeuNB8LnLI0BCkORO/pubhtml?gid=1621427280&single=true
      - 拍照預約表單: https://docs.google.com/forms/d/e/1FAIpQLSfx-lppzU3pMrn4D2LoDwOpp26mzeMRSfp7pNJM2-Dw5tb6Dg/viewform
      - 拍照方案明細: https://docs.google.com/spreadsheets/d/1jpyWJEgRXJFrMWpCP87VQntyfbYRRD2R/edit?gid=799803463#gid=799803463
      - 學位服提問區: https://docs.google.com/spreadsheets/d/12cQSMlPNDS9QlquOWXorjFyWQR4VXqwr6aHcYo5aRr8/edit?gid=0#gid=0

extra_javascript:
  - javascripts/external-links.js
